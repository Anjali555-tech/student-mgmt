{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<h1>➕ Add New Student</h1>

<form method="POST" action="{{ url_for('add') }}">
    <label>Name *</label>
    <input type="text" name="name" required maxlength="100" placeholder="e.g., Priya Sharma">

    <label>Email *</label>
    <input type="email" name="email" required maxlength="100" placeholder="e.g., priya@example.com">

    <label>Phone (optional)</label>
    <input type="text" name="phone" maxlength="15" placeholder="e.g., 9876543210">

    <label>Branch *</label>
    <select name="branch" required>
        <option value="">-- Select --</option>
        <option value="CSE">CSE</option>
        <option value="ECE">ECE</option>
        <option value="EEE">EEE</option>
        <option value="MECH">MECH</option>
        <option value="CIVIL">CIVIL</option>
        <option value="IT">IT</option>
        <option value="AIML">AIML</option>
        <option value="DS">DS</option>
    </select>

    <label>Year *</label>
    <select name="year" required>
        <option value="">-- Select --</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
    </select>

    <label>CGPA (optional)</label>
    <input type="number" name="cgpa" step="0.01" min="0" max="10" placeholder="e.g., 8.50">

    <button type="submit" class="btn btn-primary">Save Student</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
